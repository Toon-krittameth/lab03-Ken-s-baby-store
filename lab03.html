<!DOCTYPE html>
<html>
<head> 
    <meta charset = "UTF-8">
    <title> Ken's Baby Store </title>
    <link rel = "stylesheet" href = "detail.css">
</head>

<body>
    <div class = "container">
        <header class = "header">
            <div class = "area">
                <h1 class = "title"> Ken's Baby Store </h1>
                <p class = "subtitle"> The touch of love</p>
            </div>
            
            <div class = "contact-box">
                <img src = "contact.png" alt = "Contact Info" class = "image-box">
            </div>
        </header>
        
        <div class = "color-bar"></div>

        <nav class = "nav-bar">
            <ul class = "nav-menu">
                <li><a href = "#">Home</a></li>
                <li><a href = "#">About us</a></li>
                <li><a href = "#">Online store</a></li>
                <li><a href = "#">What's new</a></li>
                <li><a href = "#">Store finder</a></li>
                <li><a href = "#">Contact us</a></li>
            </ul>
            
            <div class = "flags-box">
                <img src = "flag.png" alt = "Flags" width = "100px" height = "25px">
            </div>
        </nav>

        <main class = "grid-gallery">
            <div class = "image-frame blanket-frame"> 
                <img src = "blanket.png" alt = "Blanket" class = "grid-image">
            </div>
            
            <div class = "image-frame basket-frame"> 
                <img src = "basket.png" alt = "Basket" class = "grid-image">
            </div>
            
            <div class = "image-frame sale-frame"> 
                <img src = "sale.png" alt = "Selected items sale" class = "grid-image">
            </div>
            
            <div class = "image-frame kids-frame"> 
                <img src = "kids.png" alt = "Kids" class = "grid-image">
            </div>

            <div class = "image-frame baby-safe-frame"> 
                <img src = "baby safe.png" alt = "Baby Safe Sleeping" class = "grid-image">
            </div>
            
            <div class = "image-frame update-online-frame"> 
                <img src = "update&online.png" alt = "Update and Online Shop" class = "grid-image">
            </div>
        </main>

        

    </div>
</body>
</html>
